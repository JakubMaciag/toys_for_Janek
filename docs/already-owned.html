<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Co Janek już ma</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>📦 Co Janek już ma</h1>
      <a href="index.html" style="color: white; font-size: 13px">Lista życzeń</a>
    </header>

    <section id="gate" class="gate">
      <p>Podaj hasło rodzinne, żeby zobaczyć listę.</p>
      <form id="gate-form">
        <input type="password" id="gate-password" placeholder="Hasło" required autofocus />
        <button type="submit">Pokaż listę</button>
      </form>
      <p id="gate-error" class="error" role="alert"></p>
    </section>

    <main id="content" hidden>
      <p class="status">
        Żeby uniknąć duplikatów — to lista rzeczy, które Janek już dostał albo ma (bez cen).
      </p>

      <div class="page-layout">
        <nav id="category-tree" class="category-tree">
          <p class="category-tree-heading">Kategorie</p>
          <div id="category-tree-items"></div>
        </nav>

        <div class="page-main">
          <div class="list-toolbar">
            <label>
              Szukaj
              <input type="search" id="search-input" placeholder="Nazwa…" />
            </label>
          </div>
          <p id="owned-empty-state" class="empty-state" hidden>Jeszcze nic tu nie ma.</p>
          <div id="owned-tiles" class="tile-grid"></div>
        </div>
      </div>
    </main>

    <script type="module" src="already-owned.js"></script>
  </body>
</html>
