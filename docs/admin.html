<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel administratora — lista zabawek</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2f6f4f" />
    <link rel="icon" href="icons/icon-192.png" />
  </head>
  <body>
    <header class="site-header">
      <h1>🔧 Panel administratora</h1>
      <div>
        <a href="index.html" style="color: white; font-size: 13px; margin-right: 12px">Zobacz listę gościa</a>
        <a href="bookmarklet.html" style="color: white; font-size: 13px; margin-right: 12px">Dodaj z telefonu</a>
        <button id="logout-btn" class="secondary" hidden type="button">Wyloguj</button>
      </div>
    </header>

    <main>
      <section id="login-view" class="gate">
        <p>Zaloguj się jako administrator.</p>
        <form id="login-form">
          <input type="email" id="login-email" placeholder="E-mail" required autocomplete="username" />
          <input
            type="password"
            id="login-password"
            placeholder="Hasło"
            required
            autocomplete="current-password"
          />
          <button type="submit">Zaloguj</button>
        </form>
        <p id="login-error" class="error" role="alert"></p>
      </section>

      <section id="admin-view" hidden>
        <div class="admin-toolbar">
          <button id="toggle-add-btn" type="button">+ Dodaj zabawkę</button>
          <button id="toggle-settings-btn" type="button" class="secondary">⚙️ Ustawienia</button>
          <label class="filter-label">
            Pokaż
            <select id="filter-select">
              <option value="all">Wszystkie</option>
              <option value="unreserved">Tylko niezarezerwowane</option>
              <option value="reserved">Tylko zarezerwowane</option>
            </select>
          </label>
          <p id="load-status" class="status"></p>
        </div>

        <form id="settings-form" class="admin-form" hidden>
          <label>
            Nowe hasło dla gości
            <input type="password" id="settings-guest-password" placeholder="np. mikolaj2026" minlength="4" />
          </label>
          <div class="form-actions">
            <button type="submit">Zapisz hasło</button>
            <button type="button" id="cancel-settings-btn" class="secondary">Anuluj</button>
          </div>
          <p id="settings-status" class="status"></p>
        </form>

        <form id="add-form" class="admin-form" hidden>
          <label>Nazwa<input type="text" id="add-name" required maxlength="200" /></label>
          <label>Cena<input type="number" id="add-price" min="0" step="0.01" /></label>
          <label>Cena przed promocją (opcjonalnie)<input type="number" id="add-original-price" min="0" step="0.01" /></label>
          <label>Waluta<input type="text" id="add-currency" maxlength="10" value="PLN" /></label>
          <label>Zdjęcie (URL)<input type="url" id="add-image" maxlength="2000" /></label>
          <label>Link do sklepu<input type="url" id="add-link" required maxlength="2000" /></label>
          <label>Komentarz administratora (opcjonalnie)<input type="text" id="add-comment" maxlength="300" /></label>
          <div class="form-actions">
            <button type="submit">Zapisz nową zabawkę</button>
            <button type="button" id="cancel-add-btn" class="secondary">Anuluj</button>
          </div>
        </form>
        <p id="add-error" class="error" role="alert"></p>

        <div id="tiles" class="tile-grid"></div>
      </section>
    </main>

    <script type="module" src="admin.js"></script>
  </body>
</html>
