<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Dodaj do listy zabawek</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Lista zabawek dla Janka</h1>
      <div class="header-actions">
        <button id="open-admin-btn" class="link-btn" type="button">Panel admina ↗</button>
        <button id="logout-btn" class="link-btn" hidden type="button">Wyloguj</button>
      </div>
    </header>

    <section id="login-view">
      <p class="hint">Zaloguj się jako administrator, żeby dodawać zabawki.</p>
      <form id="login-form">
        <label>
          E-mail
          <input type="email" id="login-email" required autocomplete="username" />
        </label>
        <label>
          Hasło
          <input type="password" id="login-password" required autocomplete="current-password" />
        </label>
        <button type="submit">Zaloguj</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="add-view" hidden>
      <button id="scan-btn" type="button">Zeskanuj tę stronę</button>
      <p class="hint">Wtyczka spróbuje odgadnąć nazwę, zdjęcie i cenę — popraw je przed zapisaniem.</p>

      <form id="toy-form" hidden>
        <label>
          Nazwa
          <input type="text" id="toy-name" required maxlength="200" />
        </label>
        <label>
          Cena
          <input type="number" id="toy-price" min="0" step="0.01" />
        </label>
        <label>
          Cena przed promocją (opcjonalnie)
          <input type="number" id="toy-original-price" min="0" step="0.01" />
        </label>
        <label>
          Waluta
          <input type="text" id="toy-currency" maxlength="10" value="PLN" />
        </label>
        <label>
          Zdjęcie (URL)
          <input type="url" id="toy-image" maxlength="2000" />
        </label>
        <img id="toy-image-preview" alt="" hidden />
        <label>
          Link do sklepu
          <input type="url" id="toy-link" required maxlength="2000" readonly />
        </label>
        <label>
          Komentarz administratora (opcjonalnie)
          <input type="text" id="toy-comment" maxlength="300" />
        </label>
        <label>
          Kategoria wiekowa (opcjonalnie)
          <select id="toy-age-category">
            <option value="">Brak (dla każdego wieku)</option>
          </select>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="toy-already-owned" />
          To już posiadana zabawka (dodaj do "Już posiadane" zamiast listy życzeń)
        </label>
        <button type="submit" id="submit-btn">Dodaj do listy</button>
      </form>
      <p id="save-status" role="status"></p>

      <div id="duplicate-warning" hidden>
        <p id="duplicate-warning-text" class="error"></p>
        <button id="duplicate-confirm-btn" type="button">Dodaj mimo to</button>
        <button id="duplicate-cancel-btn" class="secondary" type="button">Anuluj</button>
      </div>

      <button id="open-site-btn" class="secondary" type="button" hidden>Zobacz na liście ↗</button>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
